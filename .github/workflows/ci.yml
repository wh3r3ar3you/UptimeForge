name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: uf
          POSTGRES_PASSWORD: uf
          POSTGRES_DB: uf
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U uf" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      UF_TEST_DATABASE_URL: postgres://uf:uf@127.0.0.1:5432/uf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

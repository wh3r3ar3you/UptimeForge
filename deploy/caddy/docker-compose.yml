# UptimeForge on a VPS behind Caddy: HTTPS from Let's Encrypt, nothing else to set up.
#
# 1. Point a DNS A/AAAA record (e.g. status.example.com) at this server; open ports 80 and 443.
# 2. In this folder:
#      echo "UF_DOMAIN=status.example.com" > .env
#      echo "UF_DB_PASSWORD=$(openssl rand -hex 24)" >> .env
#      echo "UF_SETUP_TOKEN=$(openssl rand -hex 16)" >> .env
#      docker compose up -d
# 3. Open https://status.example.com and create the admin with the setup token from .env.
#
# Needs Docker Compose 2.23+ (the Caddyfile lives inside this file).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: uptimeforge
      POSTGRES_PASSWORD: ${UF_DB_PASSWORD:?put UF_DB_PASSWORD into .env}
      POSTGRES_DB: uptimeforge
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U uptimeforge]
      interval: 5s
      timeout: 5s
      retries: 20

  hub:
    image: intoxxx/uptimeforge-hub:latest
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      UF_DATABASE_URL: postgres://uptimeforge:${UF_DB_PASSWORD}@postgres:5432/uptimeforge?sslmode=disable
      UF_PUBLIC_URL: https://${UF_DOMAIN:?put UF_DOMAIN into .env}
      UF_SETUP_TOKEN: ${UF_SETUP_TOKEN:-}
      UF_ADMIN_TOKEN: ${UF_ADMIN_TOKEN:-}
      UF_METRICS_TOKEN: ${UF_METRICS_TOKEN:-}
      TZ: ${TZ:-UTC}
    volumes:
      - hub-data:/data
    # No published port: only Caddy reaches the hub.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [hub]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config

configs:
  caddyfile:
    content: |
      ${UF_DOMAIN} {
        encode zstd gzip
        # WebSockets (agents, live updates) are proxied as they are.
        reverse_proxy hub:8080
      }

volumes:
  pg-data:
  hub-data:
  caddy-data:
  caddy-config:

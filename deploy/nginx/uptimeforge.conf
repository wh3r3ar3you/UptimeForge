# UptimeForge behind an nginx that already runs on the server.
#
# 1. Start the hub with the main docker-compose.yml (it listens on 127.0.0.1:8080)
#    and UF_PUBLIC_URL=https://status.example.com in .env.
# 2. Copy this file to /etc/nginx/conf.d/uptimeforge.conf (or sites-available +
#    a link in sites-enabled) and replace status.example.com with your domain.
# 3. Get a certificate:  certbot --nginx -d status.example.com
#    certbot adds the listen 443 / ssl_certificate lines and the redirect from http.
# 4. nginx -t && systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name status.example.com;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Agents and live pages use WebSockets.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # The hub trusts these only from loopback and private addresses
        # (UF_TRUSTED_PROXIES): the login rate limit and secure cookies need them.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An agent's WebSocket stays open for hours; it pings every 20 s.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
